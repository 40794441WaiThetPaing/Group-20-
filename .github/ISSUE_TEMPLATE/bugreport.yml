name: Bug Report
description: Report a reproducible bug in the project.
title: "[Bug]: "
labels: ["bug", "triage"]
projects: ["40794441WaiThetPaing/Group-20-"]
assignees:
  - 40794441WaiThetPaing
  - 40794434
  - ElJefeNathan
  - HaymarnYinHtwe
  - RyanDaMob
  - PyiTheinKyaw40794499

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill in the details below to help us resolve the issue faster.

  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots (optional)
      placeholder: Paste error logs or describe the image shown
      render: shell

  - type: textarea
    id: possible-cause
    attributes:
      label: Possible Cause (optional)
      placeholder: What do you think might be causing the issue?

  - type: dropdown
    id: browsers
    attributes:
      label: What browsers are you seeing the problem on?
      multiple: true
      options:
        - Firefox
        - Chrome
        - Safari
        - Microsoft Edge

  - type: input
    id: environment
    attributes:
      label: Environment (optional)
      placeholder: e.g., GitHub Actions, Java 17, Maven 3.9.x

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        label: I agree to follow this project's Code of Conduct
        validations:
          required: true
